<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bookkeeping Dashboard — Fardeen Saad</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f4f6fb;
      --card:#ffffff;
      --muted:#6b7280;
      --accent:#0a2a5a;
      --accent-2:#123a8a;
      --success:#0f9d58;
      --danger:#e53935;
      --radius:12px;
      --shadow: 0 6px 20px rgba(18, 58, 138, 0.08);
    }

    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:#0f1724;}

    nav{display:flex;gap:18px;align-items:center;padding:14px 26px;background:linear-gradient(90deg,var(--accent),var(--accent-2));color:white;box-shadow:0 6px 30px rgba(9,29,66,0.18);position:sticky;top:0;z-index:40;}
    nav .brand{font-weight:700;letter-spacing:0.2px;margin-right:12px}
    nav .navlinks{display:flex;gap:14px;margin-left:6px}
    nav a{color:white;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:600;opacity:0.95;cursor:pointer;}
    nav a:hover{transform:translateY(-2px);opacity:1}
    nav a.decoy{opacity:0.8;font-weight:500}

    .wrap{max-width:1100px;margin:28px auto;padding:0 20px}

    .topcards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:18px}
    .card{background:var(--card);border-radius:var(--radius);padding:18px;border:1px solid rgba(10,42,90,0.06);box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease}
    .card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(18,58,138,0.09)}

    .card h3{margin:0;font-size:13px;color:var(--muted);font-weight:600}
    .card .big{margin-top:8px;font-size:20px;font-weight:800}
    .clickable{cursor:pointer}

    .preview table{width:100%;border-collapse:collapse;margin-top:12px}
    .preview th,.preview td{padding:10px;text-align:left;border-bottom:1px solid #eef2fb}
    .preview th{font-size:12px;color:var(--muted);font-weight:700}
    .preview tr:hover{background:#fbfdff}

    table.activity{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
    table.activity thead th{background:linear-gradient(180deg,#eef6ff, #e6eefb);padding:12px;text-align:left;font-weight:700;color:#0b254b}
    table.activity td{padding:12px;border-top:1px solid rgba(10,42,90,0.03)}
    table.activity tr:hover{background:rgba(10,42,90,0.02)}

    .amount.positive{color:var(--success);font-weight:700}
    .amount.negative{color:var(--danger);font-weight:700}

    @media (max-width:900px){
      .topcards{grid-template-columns:repeat(2,1fr)}
    }
    @media (max-width:560px){
      .topcards{grid-template-columns:1fr}
      nav{overflow:auto}
      table.activity{display:block;overflow-x:auto;white-space:nowrap}
      table.activity thead th:nth-child(5),table.activity td:nth-child(5){display:none}
    }
  </style>
</head>
<body>
  <nav>
    <div class="brand">Fardeen • Credit Union</div>
    <div class="navlinks">
      <a onclick="showSection('home')">Home</a>
      <a onclick="showSection('activity')">Activity</a>
      <a class="decoy">Statements</a>
      <a class="decoy">Profile</a>
      <a class="decoy">Fund Transfer</a>
    </div>
  </nav>

  <div class="wrap">
    <section id="home">
      <h1>Welcome Fardeen Saad</h1>
      <div class="topcards">
        <div class="card clickable" onclick="showSection('activity')">
          <h3>Current Available Balance</h3>
          <div class="big" id="totalBalance">$488,290.09</div>
        </div>
        <div class="card clickable" onclick="showSection('activity')">
          <h3>Total Monthly Profit/Loss</h3>
          <div class="big" id="monthlyPL">+ $13,200.02</div>
        </div>
        <div class="card clickable" onclick="showSection('activity')">
          <h3>Recent Activity</h3>
          <div class="preview">
            <table>
              <thead><tr><th>Vendor</th><th>Date</th><th>Type</th><th>Amount</th></tr></thead>
              <tbody id="previewRows"></tbody>
            </table>
          </div>
        </div>
        <div class="card clickable" onclick="showSection('activity')">
          <h3>Total Assets</h3>
          <div class="big">1,577,089.09</div>
        </div>
      </div>
    </section>

    <section id="activitySection" style="display:none;">
      <h2>Activity</h2>
      <table class="activity" id="activityTable">
        <thead>
          <tr><th>Vendor</th><th>Date</th><th>Type</th><th>Amount</th><th>Balance</th></tr>
        </thead>
        <tbody id="activityBody"></tbody>
      </table>
    </section>
  </div>

  <script>
    let transactions = [];
    const FINAL_BALANCE = 488290.09;

    function showSection(name){
      document.getElementById('home').style.display = name==='home'?'block':'none';
      document.getElementById('activitySection').style.display = name==='activity'?'block':'none';
      if(name==='activity') renderActivity();
    }

    function initPreview(){
      const container = document.getElementById('previewRows'); container.innerHTML='';
      transactions.slice(0,3).forEach(t=>{
        const tr = document.createElement('tr');
        const amt = (t.type==='Debit'?'-':'') + '$'+ t.amount.toFixed(2);
        tr.innerHTML = `<td>${t.vendor}</td><td>${t.date}</td><td>${t.type}</td><td>${amt}</td>`;
        container.appendChild(tr);
      });
    }

    function computeBalances(arr){
      let a = arr.slice().sort((x,y)=> new Date(x.date)-new Date(y.date));
      let net = a.reduce((s,t)=> s+(t.type==='Credit'?t.amount:-t.amount),0);
      let running = FINAL_BALANCE - net;
      a.forEach(t=>{running+=(t.type==='Credit'?t.amount:-t.amount);t.running=+running.toFixed(2);});
      return a;
    }

    function renderActivity(){
      const tbody = document.getElementById('activityBody'); tbody.innerHTML='';
      computeBalances(transactions).slice().reverse().forEach(t=>{
        const amt = (t.type==='Debit'?'-':'')+'$'+t.amount.toFixed(2);
        const tr = document.createElement('tr');
        tr.innerHTML=`<td>${t.vendor}</td><td>${t.date}</td><td>${t.type}</td><td>${amt}</td><td>$${t.running}</td>`;
        tbody.appendChild(tr);
      });
    }

    // populate 20 sample transactions
    for(let i=0;i<20;i++){
      const type = Math.random()<0.5?'Credit':'Debit';
      const amt = +(Math.random()*5000+50).toFixed(2);
      const date = `2025-11-${(Math.floor(Math.random()*22)+1).toString().padStart(2,'0')}`;
      transactions.push({vendor:'Vendor '+(i+1),date:date,type:type,amount:amt});
    }

    initPreview(); renderActivity(); showSection('home');
  </script>
</body>
</html>
